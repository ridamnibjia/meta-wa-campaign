<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>WA Campaign</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  // shadcn/ui's token names and scale, without shadcn's build step. Components
  // in ui.jsx use these semantic classes (bg-card, text-muted-foreground) so a
  // future move to a real bundler is a find-and-replace, not a rewrite.
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          border: 'hsl(var(--border))', input: 'hsl(var(--input))', ring: 'hsl(var(--ring))',
          background: 'hsl(var(--background))', foreground: 'hsl(var(--foreground))',
          primary:   { DEFAULT: 'hsl(var(--primary))',   foreground: 'hsl(var(--primary-foreground))' },
          secondary: { DEFAULT: 'hsl(var(--secondary))', foreground: 'hsl(var(--secondary-foreground))' },
          muted:     { DEFAULT: 'hsl(var(--muted))',     foreground: 'hsl(var(--muted-foreground))' },
          accent:    { DEFAULT: 'hsl(var(--accent))',    foreground: 'hsl(var(--accent-foreground))' },
          destructive: { DEFAULT: 'hsl(var(--destructive))', foreground: 'hsl(var(--destructive-foreground))' },
          card:      { DEFAULT: 'hsl(var(--card))',      foreground: 'hsl(var(--card-foreground))' },
          success:   { DEFAULT: 'hsl(var(--success))',   foreground: 'hsl(var(--success-foreground))' },
          warning:   { DEFAULT: 'hsl(var(--warning))',   foreground: 'hsl(var(--warning-foreground))' },
        },
        borderRadius: { lg: 'var(--radius)', md: 'calc(var(--radius) - 2px)', sm: 'calc(var(--radius) - 4px)' },
        fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'] },
      },
    },
  };
</script>

<style type="text/tailwindcss">
  :root {
    --background: 0 0% 100%;        --foreground: 240 10% 3.9%;
    --card: 0 0% 100%;              --card-foreground: 240 10% 3.9%;
    --primary: 142 71% 29%;         --primary-foreground: 0 0% 98%;
    --secondary: 240 4.8% 95.9%;    --secondary-foreground: 240 5.9% 10%;
    --muted: 240 4.8% 95.9%;        --muted-foreground: 240 3.8% 46.1%;
    --accent: 240 4.8% 95.9%;       --accent-foreground: 240 5.9% 10%;
    --destructive: 0 72% 51%;       --destructive-foreground: 0 0% 98%;
    --success: 142 71% 35%;         --success-foreground: 0 0% 98%;
    --warning: 38 92% 45%;          --warning-foreground: 0 0% 98%;
    --border: 240 5.9% 90%;         --input: 240 5.9% 90%;  --ring: 142 71% 29%;
    --radius: 0.5rem;
  }
  .dark {
    --background: 240 10% 3.9%;     --foreground: 0 0% 98%;
    --card: 240 6% 8%;              --card-foreground: 0 0% 98%;
    --primary: 142 60% 45%;         --primary-foreground: 240 10% 4%;
    --secondary: 240 3.7% 15.9%;    --secondary-foreground: 0 0% 98%;
    --muted: 240 3.7% 15.9%;        --muted-foreground: 240 5% 64.9%;
    --accent: 240 3.7% 15.9%;       --accent-foreground: 0 0% 98%;
    --destructive: 0 62% 50%;       --destructive-foreground: 0 0% 98%;
    --success: 142 60% 45%;         --success-foreground: 240 10% 4%;
    --warning: 38 92% 55%;          --warning-foreground: 240 10% 4%;
    --border: 240 3.7% 17%;         --input: 240 3.7% 17%;  --ring: 142 60% 45%;
  }
  body { @apply bg-background text-foreground antialiased; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { @apply bg-border rounded-full; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
</head>

<body class="h-full">
  <div id="root" class="h-full"></div>

  <!-- Order matters: primitives, then views, then the app that mounts them.
       Babel executes these in document order once all are fetched. -->
  <script type="text/babel" data-presets="react" src="/ui.jsx"></script>
  <script type="text/babel" data-presets="react" src="/views/dashboard.jsx"></script>
  <script type="text/babel" data-presets="react" src="/views/campaign.jsx"></script>
  <script type="text/babel" data-presets="react" src="/views/inbox.jsx"></script>
  <script type="text/babel" data-presets="react" src="/views/settings.jsx"></script>
  <script type="text/babel" data-presets="react" src="/app.jsx"></script>
</body>
</html>
