<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WA Campaign</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f4f5; color: #18181b; font-size: 14px; line-height: 1.5; min-height: 100vh; }
  ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 3px; }
</style>
</head>
<body>
<div id="root"><div style="height:100vh;display:flex;align-items:center;justify-content:center;color:#a1a1aa;font-size:13px;flex-direction:column;gap:8px"><div>Loading React app...</div><div style="font-size:11px;color:#d4d4d8">First load may take 3-5s (Babel compiling)</div></div></div>

<!-- CDN deps: loaded at bottom so inline scripts can't reference them before they're ready -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

// ─── Backend URL resolution ────────────────────────────────────────────────────
// In local dev:  backend is on the same origin, use relative URLs ('')
// On Cloudflare Pages: backend is the Render URL stored in localStorage
function getStoredBackend() {
  const hostname = window.location.hostname;
  const stored = localStorage.getItem('wa_campaign_backend');
  if (stored) return stored;
  // Only show the setup screen on known CDN/Pages deployments
  // (where frontend and backend are on different servers)
  const isCDN = hostname.endsWith('.pages.dev') ||
                hostname.endsWith('.netlify.app') ||
                hostname.endsWith('.vercel.app');
  return isCDN ? null : '';  // '' = use relative URLs (same server)
}

// ─── API factory — all calls go through here ──────────────────────────────────
function makeApi(backendUrl) {
  const base = backendUrl || '';
  const post = (path, data = {}) =>
    fetch(base + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }).then(r => r.json());
  const get = path => fetch(base + path).then(r => r.json());
  const upload = (path, formData) => fetch(base + path, { method: 'POST', body: formData }).then(r => r.json());
  return { post, get, upload };
}

// ─── Tiny design tokens ───────────────────────────────────────────────────────
const C = {
  bg: '#f4f4f5', surface: '#ffffff', border: '#e4e4e7', border2: '#d4d4d8',
  text: '#18181b', text2: '#71717a', text3: '#a1a1aa',
  blue: '#2563eb', green: '#16a34a', red: '#dc2626', amber: '#d97706',
  greenBg: '#f0fdf4', redBg: '#fef2f2', amberBg: '#fffbeb', blueBg: '#eff6ff',
};

// ─── Reusable components ──────────────────────────────────────────────────────
const Field = ({ label, hint, children, inline }) => (
  <div style={{ display: 'flex', flexDirection: inline ? 'row' : 'column', gap: inline ? 8 : 4, marginBottom: 12, alignItems: inline ? 'center' : undefined }}>
    {label && <label style={{ fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '.4px', color: C.text2, flexShrink: 0 }}>{label}</label>}
    {children}
    {hint && <span style={{ fontSize: 10, color: C.text3, lineHeight: 1.5 }}>{hint}</span>}
  </div>
);

const TextInput = ({ value, onChange, onBlur, type = 'text', placeholder, mono, style }) => {
  const [focused, setFocused] = useState(false);
  return (
    <input type={type} value={value} placeholder={placeholder} readOnly={!onChange}
      onChange={e => onChange?.(e.target.value)} onBlur={() => { setFocused(false); onBlur?.(); }}
      onFocus={() => setFocused(true)}
      style={{ background: '#fff', border: `1px solid ${focused ? C.blue : C.border}`, borderRadius: 6, color: C.text, fontFamily: mono ? 'monospace' : 'inherit', fontSize: 12, padding: '8px 10px', outline: 'none', width: '100%', boxShadow: focused ? '0 0 0 2px rgba(37,99,235,.1)' : 'none', transition: 'border-color .12s, box-shadow .12s', ...style }} />
  );
};

const NumberInput = ({ value, onChange, min = 1, max }) => (
  <input type="number" value={value} min={min} max={max}
    onChange={e => onChange(parseInt(e.target.value) || min)}
    style={{ background: '#fff', border: `1px solid ${C.border}`, borderRadius: 6, color: C.text, fontFamily: 'monospace', fontSize: 12, padding: '8px 10px', outline: 'none', width: '100%' }} />
);

const Btn = ({ onClick, disabled, variant = 'ghost', size = 'md', full, children }) => {
  const [hovered, setHovered] = useState(false);
  const v = {
    primary: { bg: hovered && !disabled ? '#1d4ed8' : C.blue, border: C.blue, color: '#fff' },
    success: { bg: hovered ? '#dcfce7' : C.greenBg, border: '#bbf7d0', color: C.green },
    danger:  { bg: hovered ? '#fee2e2' : C.redBg,   border: '#fecaca', color: C.red },
    ghost:   { bg: hovered ? C.bg : '#fff',          border: C.border,  color: C.text2 },
  }[variant];
  const s = { sm: { padding: '5px 11px', fontSize: 11 }, md: { padding: '8px 14px', fontSize: 12 } }[size];
  return <button onClick={disabled ? undefined : onClick} onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)}
    style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 5, border: `1px solid ${v.border}`, borderRadius: 6, cursor: disabled ? 'not-allowed' : 'pointer', fontWeight: 600, fontFamily: 'inherit', background: v.bg, color: v.color, opacity: disabled ? .4 : 1, whiteSpace: 'nowrap', width: full ? '100%' : undefined, transition: 'background .12s', ...s }}>{children}</button>;
};

const Card = ({ children, style }) => (
  <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, overflow: 'hidden', ...style }}>{children}</div>
);

const CardSection = ({ label, right }) => (
  <div style={{ padding: '10px 14px 6px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
    <span style={{ fontSize: 10, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '.5px', color: C.text3 }}>{label}</span>
    {right}
  </div>
);

const Badge = ({ color = 'gray', children }) => {
  const colors = {
    green: { bg: C.greenBg, border: '#bbf7d0', text: C.green },
    red:   { bg: C.redBg,   border: '#fecaca', text: C.red },
    amber: { bg: C.amberBg, border: '#fde68a', text: C.amber },
    blue:  { bg: C.blueBg,  border: '#bfdbfe', text: C.blue },
    gray:  { bg: C.bg,      border: C.border,  text: C.text2 },
  }[color] || colors.gray;
  return <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4, padding: '2px 7px', borderRadius: 20, fontSize: 10, fontWeight: 700, letterSpacing: '.3px', textTransform: 'uppercase', fontFamily: 'monospace', background: colors.bg, border: `1px solid ${colors.border}`, color: colors.text }}>
    <span style={{ width: 5, height: 5, borderRadius: '50%', background: 'currentColor', flexShrink: 0 }} />{children}
  </span>;
};

const StatCard = ({ label, value, color }) => (
  <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: '12px 14px', flex: 1, minWidth: 0 }}>
    <div style={{ fontSize: 26, fontWeight: 800, fontFamily: 'monospace', letterSpacing: '-.5px', color: color || C.text, lineHeight: 1 }}>{(value || 0).toLocaleString()}</div>
    <div style={{ fontSize: 9, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '.6px', color: C.text3, marginTop: 4 }}>{label}</div>
  </div>
);

const PhasePill = ({ phase }) => {
  const d = { idle: { bg: C.bg, color: C.text3 }, running: { bg: C.greenBg, color: C.green }, paused: { bg: C.amberBg, color: C.amber }, done: { bg: C.blueBg, color: C.blue } }[phase] || { bg: C.bg, color: C.text3 };
  return <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, padding: '3px 10px', borderRadius: 20, background: d.bg, fontSize: 11, fontWeight: 700, fontFamily: 'monospace', color: d.color }}>
    <span style={{ width: 6, height: 6, borderRadius: '50%', background: 'currentColor', flexShrink: 0 }} />{phase}
  </span>;
};

// ─── Backend setup screen (shown once on Cloudflare Pages deployment) ─────────
function BackendSetup({ onSave }) {
  const [url, setUrl] = useState('');
  const [testing, setTesting] = useState(false);
  const [err, setErr] = useState('');
  const save = async () => {
    const clean = url.trim().replace(/\/$/, '');
    if (!clean.startsWith('http')) { setErr('Enter a full URL starting with https://'); return; }
    setTesting(true); setErr('');
    try {
      const r = await fetch(clean + '/health', { signal: AbortSignal.timeout(8000) }).then(r => r.json());
      if (r.status === 'ok') { localStorage.setItem('wa_campaign_backend', clean); onSave(clean); }
      else setErr('Server responded but /health check failed');
    } catch (e) { setErr('Could not reach server. Check the URL and make sure it is running.'); }
    setTesting(false);
  };
  return (
    <div style={{ height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: C.bg, padding: 20 }}>
      <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, padding: 28, maxWidth: 420, width: '100%' }}>
        <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 4 }}>Connect to Backend</div>
        <div style={{ fontSize: 12, color: C.text2, marginBottom: 20, lineHeight: 1.6 }}>
          You are running the frontend on Cloudflare Pages. Enter your Render backend URL to connect. This is saved in your browser and only needs to be done once.
        </div>
        <Field label="Render Backend URL" hint="e.g. https://meta-wa-campaign.onrender.com">
          <TextInput value={url} onChange={setUrl} placeholder="https://your-app.onrender.com" mono />
        </Field>
        {err && <div style={{ fontSize: 12, color: C.red, marginBottom: 12 }}>{err}</div>}
        <Btn variant="primary" size="md" full onClick={save} disabled={!url || testing}>{testing ? 'Testing connection...' : 'Save and Connect'}</Btn>
        <div style={{ marginTop: 14, fontSize: 11, color: C.text3, lineHeight: 1.6 }}>
          Don't have a backend yet? <a href="https://github.com/your-repo#deployment" style={{ color: C.blue }}>Deployment guide →</a>
        </div>
      </div>
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────────────────────
function App() {
  const [backendUrl, setBackendUrl] = useState(() => getStoredBackend());

  if (backendUrl === null) {
    return <BackendSetup onSave={url => setBackendUrl(url)} />;
  }
  return <Campaign backendUrl={backendUrl} onChangeBackend={() => { localStorage.removeItem('wa_campaign_backend'); setBackendUrl(null); }} />;
}

function Campaign({ backendUrl, onChangeBackend }) {
  const api = useRef(makeApi(backendUrl));

  // Server state (from socket + REST)
  const [ss, setSS] = useState({ phase: 'idle', accepted: 0, delivered: 0, read: 0, failed: 0, skipped: 0, dailyCount: 0, dailyCap: 1000, total: 0, currentIdx: 0, currentContact: null, pauseReason: null, configured: false });
  // Local UI state
  const [creds, setCreds]     = useState({ phoneId: 'YOUR_PHONE_NUMBER_ID', token: '', wabaId: '' });
  const [contacts, setContacts] = useState({ count: 0, sample: [], file: '' });
  const [tmpl, setTmpl]       = useState({ name: 'your_template_name', status: null, category: null, language: 'en', bodyText: null, checking: false, error: null });
  const [settings, setSettings] = useState({ delaySec: 2, dailyCap: 1000 });
  const [logs, setLogs]       = useState([]);
  const [failLog, setFailLog] = useState([]);
  const [showToken, setShowToken] = useState(false);
  const [savedOk, setSavedOk] = useState(false);
  const [starting, setStarting] = useState(false);
  const [dragging, setDragging] = useState(false);
  const [connected, setConnected] = useState(false);

  const logEndRef   = useRef(null);
  const validateRef = useRef(null);

  // ── Socket ──────────────────────────────────────────────────────
  useEffect(() => {
    const opts = backendUrl ? { transports: ['websocket', 'polling'] } : {};
    const sock = backendUrl ? io(backendUrl, opts) : io();
    sock.on('connect',    () => setConnected(true));
    sock.on('disconnect', () => setConnected(false));
    sock.on('state',  s  => setSS(s));
    sock.on('log',    e  => setLogs(p => [...p.slice(-400), e]));
    sock.on('logs',   ls => setLogs(ls.slice(-400)));
    // Keep-alive ping every 10 minutes (prevents Render free tier from sleeping)
    const ka = setInterval(() => fetch((backendUrl || '') + '/health').catch(() => {}), 10 * 60 * 1000);
    return () => { sock.disconnect(); clearInterval(ka); };
  }, [backendUrl]);

  // ── Initial load ─────────────────────────────────────────────────
  useEffect(() => {
    api.current.get('/api/state').then(s => {
      if (s.config) {
        if (s.config.templateName) setTmpl(t => ({ ...t, name: s.config.templateName }));
        if (s.config.delaySec)     setSettings(p => ({ ...p, delaySec: s.config.delaySec }));
        if (s.config.dailyCap)     setSettings(p => ({ ...p, dailyCap: s.config.dailyCap }));
      }
      if (s.total > 0) setContacts(c => ({ ...c, count: s.total }));
    }).catch(() => {});
    api.current.get('/api/faillog').then(d => setFailLog(d || [])).catch(() => {});
  }, []);

  // ── Auto-scroll logs ─────────────────────────────────────────────
  useEffect(() => { logEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [logs]);

  // ── Credentials: auto-save on blur ───────────────────────────────
  const saveCreds = useCallback(async () => {
    if (!creds.token && !creds.phoneId) return;
    await api.current.post('/api/config', { phoneNumberId: creds.phoneId, accessToken: creds.token, wabaId: creds.wabaId });
    setSavedOk(true); setTimeout(() => setSavedOk(false), 2500);
  }, [creds]);

  // ── Template: auto-validate with debounce ─────────────────────────
  const doValidate = useCallback(async (name) => {
    if (!name) return;
    setTmpl(t => ({ ...t, checking: true, status: null, error: null }));
    const r = await api.current.get(`/api/validate-template?name=${encodeURIComponent(name)}`).catch(() => ({ error: 'Network error' }));
    if (r.error) {
      setTmpl(t => ({ ...t, checking: false, status: 'error', error: r.error }));
    } else if (!r.found) {
      setTmpl(t => ({ ...t, checking: false, status: 'not_found' }));
    } else {
      const tmplData = r.templates[0];
      setTmpl(t => ({ ...t, checking: false, status: tmplData.status, category: tmplData.category, language: tmplData.language, bodyText: tmplData.bodyText }));
      await api.current.post('/api/config', { templateName: name, templateCategory: tmplData.category, templateLanguage: tmplData.language });
    }
  }, []);

  const onTmplChange = useCallback((name) => {
    setTmpl(t => ({ ...t, name, status: null }));
    clearTimeout(validateRef.current);
    if (name) validateRef.current = setTimeout(() => doValidate(name), 1200);
  }, [doValidate]);

  // ── CSV upload ────────────────────────────────────────────────────
  const uploadCSV = useCallback(async (file) => {
    const fd = new FormData(); fd.append('csv', file);
    const r = await api.current.upload('/api/upload-csv', fd);
    if (r.ok) setContacts({ count: r.count, sample: r.sample, file: file.name });
  }, []);

  // ── Campaign actions ──────────────────────────────────────────────
  const doStart = async () => {
    setStarting(true);
    await api.current.post('/api/config', { delaySec: settings.delaySec, dailyCap: settings.dailyCap });
    const r = await api.current.post('/api/start');
    if (!r.ok) alert('Error: ' + r.error);
    setStarting(false);
  };
  const doPause  = () => api.current.post('/api/pause',  {});
  const doResume = () => api.current.post('/api/resume', {});
  const doStop   = () => { if (confirm('Stop the campaign?')) api.current.post('/api/stop', {}); };
  const doReset  = () => { if (confirm('Reset everything?')) { api.current.post('/api/reset', {}); setContacts({ count: 0, sample: [], file: '' }); setLogs([]); } };

  // ── Derived stats ─────────────────────────────────────────────────
  const { phase, accepted, delivered, read, failed, skipped, dailyCount, dailyCap, total, currentContact, pauseReason, configured } = ss;
  const done  = accepted + failed + skipped;
  const pct   = total > 0 ? Math.round(done / total * 100) : 0;
  const dRate = accepted > 0 ? Math.round(delivered / accepted * 100) + '%' : '—';
  const rRate = accepted > 0 ? Math.round(read / accepted * 100) + '%' : '—';
  const isReady    = (configured || savedOk) && contacts.count > 0 && phase === 'idle';
  const isRunning  = phase === 'running';
  const isPaused   = phase === 'paused';

  // ── Template status badge ─────────────────────────────────────────
  const TmplStatus = () => {
    if (tmpl.checking) return <span style={{ fontSize: 11, color: C.text3 }}>Checking...</span>;
    if (!tmpl.status) return null;
    if (tmpl.status === 'error') return <span style={{ fontSize: 11, color: C.red }}>{tmpl.error}</span>;
    if (tmpl.status === 'not_found') return <Badge color="red">Not found</Badge>;
    const color = tmpl.status === 'APPROVED' ? 'green' : tmpl.status === 'PENDING' ? 'amber' : 'red';
    const catColor = { MARKETING: 'amber', UTILITY: 'blue', AUTHENTICATION: 'blue' }[tmpl.category] || 'gray';
    return (
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5, marginTop: 6 }}>
        <Badge color={color}>{tmpl.status}</Badge>
        {tmpl.category && <Badge color={catColor}>{tmpl.category}</Badge>}
        {tmpl.language && <Badge>{tmpl.language}</Badge>}
      </div>
    );
  };

  const isMobile = typeof window !== 'undefined' && window.innerWidth < 768;

  return (
    <div style={{ minHeight: '100vh', background: C.bg }}>

      {/* ── Header ──────────────────────────────────────────────── */}
      <header style={{ background: '#fff', borderBottom: `1px solid ${C.border}`, height: 52, display: 'flex', alignItems: 'center', padding: '0 18px', gap: 10, position: 'sticky', top: 0, zIndex: 30 }}>
        <span style={{ fontSize: 14, fontWeight: 700, letterSpacing: '-.2px' }}>WA Campaign</span>
        <div style={{ width: 1, height: 18, background: C.border, flexShrink: 0 }} />
        <PhasePill phase={phase} />
        {!connected && <span style={{ fontSize: 10, color: C.red, fontFamily: 'monospace' }}>disconnected</span>}
        {pauseReason && <span style={{ fontSize: 11, color: C.amber, fontStyle: 'italic', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: 200 }}>{pauseReason}</span>}
        <div style={{ marginLeft: 'auto', display: 'flex', gap: 6 }}>
          {isPaused  && <Btn variant="success" onClick={doResume}>Resume</Btn>}
          {isRunning && <Btn variant="ghost" onClick={doPause}>Pause</Btn>}
          {(isRunning || isPaused) && <Btn variant="danger" onClick={doStop}>Stop</Btn>}
          <Btn variant="ghost" onClick={doReset}>Reset</Btn>
          {backendUrl && <Btn variant="ghost" onClick={onChangeBackend} size="sm">Change server</Btn>}
        </div>
      </header>

      {/* ── Body ────────────────────────────────────────────────── */}
      <div style={{ display: 'flex', gap: 14, padding: '14px', maxWidth: 1200, margin: '0 auto', flexDirection: isMobile ? 'column' : 'row', alignItems: 'flex-start' }}>

        {/* ── LEFT: Setup ─────────────────────────────────────── */}
        <div style={{ width: isMobile ? '100%' : 320, flexShrink: 0, display: 'flex', flexDirection: 'column', gap: 12 }}>

          {/* Credentials */}
          <Card>
            <CardSection label="API Credentials" right={savedOk && <span style={{ fontSize: 10, color: C.green, fontWeight: 600 }}>Saved</span>} />
            <div style={{ padding: '4px 14px 14px', display: 'flex', flexDirection: 'column', gap: 0 }}>
              <Field label="Phone Number ID">
                <TextInput value={creds.phoneId} onChange={v => setCreds(p => ({ ...p, phoneId: v }))} onBlur={saveCreds} mono />
              </Field>
              <Field label="Access Token" hint="Paste token — auto-saves when you click away">
                <div style={{ display: 'flex', gap: 6 }}>
                  <TextInput type={showToken ? 'text' : 'password'} value={creds.token} onChange={v => setCreds(p => ({ ...p, token: v }))} onBlur={saveCreds} placeholder="EAABxx..." mono />
                  <button onClick={() => setShowToken(!showToken)} style={{ padding: '0 10px', background: C.bg, border: `1px solid ${C.border}`, borderRadius: 6, color: C.text2, cursor: 'pointer', fontSize: 11, fontWeight: 600, flexShrink: 0 }}>{showToken ? 'Hide' : 'Show'}</button>
                </div>
              </Field>
              <Field label="WABA ID" hint="For template validation. Auto-resolved if blank.">
                <TextInput value={creds.wabaId} onChange={v => setCreds(p => ({ ...p, wabaId: v }))} onBlur={saveCreds} placeholder="Auto-resolved" mono />
              </Field>
            </div>
          </Card>

          {/* Contacts */}
          <Card>
            <CardSection label="Contacts" right={contacts.count > 0 && <span style={{ fontSize: 11, fontWeight: 700, color: C.green }}>{contacts.count.toLocaleString()} loaded</span>} />
            <div style={{ padding: '4px 14px 14px' }}>
              <label htmlFor="csv-input"
                onDragOver={e => { e.preventDefault(); setDragging(true); }}
                onDragLeave={() => setDragging(false)}
                onDrop={e => { e.preventDefault(); setDragging(false); const f = e.dataTransfer.files[0]; if (f?.name.endsWith('.csv')) uploadCSV(f); }}
                style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 4, border: `1px dashed ${dragging ? C.blue : C.border2}`, borderRadius: 8, padding: contacts.count > 0 ? '14px' : '20px', textAlign: 'center', cursor: 'pointer', background: dragging ? '#eff6ff' : C.bg, transition: 'all .15s', minHeight: 70 }}>
                {contacts.count > 0 ? (
                  <>
                    <div style={{ fontSize: 22, fontWeight: 800, fontFamily: 'monospace', color: C.green }}>{contacts.count.toLocaleString()}</div>
                    <div style={{ fontSize: 11, color: C.text2 }}>{contacts.file} &mdash; click to replace</div>
                  </>
                ) : (
                  <>
                    <div style={{ fontSize: 13, fontWeight: 500, color: C.text2 }}>Drop CSV or tap to select</div>
                    <div style={{ fontSize: 10, color: C.text3 }}>Google Contacts export · reads Name, Mobile Phone</div>
                  </>
                )}
              </label>
              <input id="csv-input" type="file" accept=".csv" style={{ display: 'none' }} onChange={e => { if (e.target.files[0]) uploadCSV(e.target.files[0]); }} />
              {contacts.sample?.length > 0 && (
                <div style={{ marginTop: 8 }}>
                  {contacts.sample.slice(0, 3).map((c, i) => (
                    <div key={i} style={{ display: 'flex', justifyContent: 'space-between', padding: '3px 0', fontSize: 11, borderBottom: `1px solid ${C.bg}`, color: C.text2 }}>
                      <span style={{ fontWeight: 500, color: C.text }}>{c.name}</span>
                      <span style={{ fontFamily: 'monospace', color: C.text3 }}>+{c.dialStr}</span>
                    </div>
                  ))}
                  {contacts.count > 3 && <div style={{ fontSize: 10, color: C.text3, marginTop: 3 }}>+ {(contacts.count - 3).toLocaleString()} more</div>}
                </div>
              )}
            </div>
          </Card>

          {/* Template */}
          <Card>
            <CardSection label="Template" />
            <div style={{ padding: '4px 14px 14px' }}>
              <Field label="Template Name" hint="Auto-validates as you type">
                <TextInput value={tmpl.name} onChange={onTmplChange} mono placeholder="your_template_name" />
              </Field>
              <TmplStatus />
              {tmpl.bodyText && (
                <div style={{ marginTop: 8, background: C.bg, borderRadius: 6, padding: '8px 10px', fontSize: 11, color: C.text2, lineHeight: 1.7, maxHeight: 90, overflow: 'auto', fontFamily: 'sans-serif', whiteSpace: 'pre-wrap', wordBreak: 'break-word', border: `1px solid ${C.border}` }}>
                  {tmpl.bodyText}
                </div>
              )}
            </div>
          </Card>

          {/* Settings */}
          <Card>
            <CardSection label="Send Settings" />
            <div style={{ padding: '4px 14px 14px', display: 'flex', gap: 10 }}>
              <Field label="Delay (s)" hint="Min 1s, rec 2s">
                <NumberInput value={settings.delaySec} onChange={v => setSettings(p => ({ ...p, delaySec: v }))} min={1} max={60} />
              </Field>
              <Field label="Daily Cap" hint="TIER_1 = 1000/day">
                <NumberInput value={settings.dailyCap} onChange={v => setSettings(p => ({ ...p, dailyCap: v }))} min={1} />
              </Field>
            </div>
          </Card>

          {/* Launch */}
          <button onClick={doStart} disabled={!isReady || starting}
            style={{ width: '100%', padding: '11px', background: isReady ? C.blue : C.border, border: 'none', borderRadius: 8, color: isReady ? '#fff' : C.text3, fontWeight: 700, fontSize: 14, fontFamily: 'inherit', cursor: isReady ? 'pointer' : 'not-allowed', transition: 'background .15s', letterSpacing: '-.1px' }}>
            {starting ? 'Starting...' : !contacts.count ? 'Upload contacts to start' : !(configured || savedOk) ? 'Save credentials to start' : 'Start Campaign'}
          </button>
          {isReady && (
            <div style={{ fontSize: 11, color: C.text3, textAlign: 'center', marginTop: -6 }}>
              ~{Math.round(contacts.count * settings.delaySec / 60)}m &bull; {Math.ceil(contacts.count / settings.dailyCap)} day{contacts.count > settings.dailyCap ? 's' : ''}
            </div>
          )}
        </div>

        {/* ── RIGHT: Monitor ─────────────────────────────────── */}
        <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', gap: 12 }}>

          {/* Pause banner */}
          {isPaused && pauseReason && (
            <div style={{ background: C.amberBg, border: `1px solid #fde68a`, borderRadius: 8, padding: '11px 14px', display: 'flex', alignItems: 'center', gap: 12 }}>
              <span style={{ flex: 1, fontSize: 12, color: C.amber, fontWeight: 500 }}>{pauseReason}</span>
              <Btn variant="success" onClick={doResume}>Resume</Btn>
            </div>
          )}

          {/* Stats */}
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            <StatCard label="Accepted"  value={accepted}  color={C.green} />
            <StatCard label="Delivered" value={delivered} color={C.blue} />
            <StatCard label="Read"      value={read}      color="#7c3aed" />
            <StatCard label="Failed"    value={failed}    color={C.red} />
            <StatCard label="Skipped"   value={skipped}   color={C.amber} />
          </div>

          {/* Rates */}
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            {[['Delivery Rate', dRate, C.green], ['Read Rate', rRate, '#7c3aed'], [`Daily ${dailyCount.toLocaleString()} / ${dailyCap.toLocaleString()}`, '', C.blue]].map(([l, v, c]) => (
              <div key={l} style={{ flex: 1, minWidth: 100, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: '9px 12px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <span style={{ fontSize: 11, color: C.text2 }}>{l}</span>
                {v && <span style={{ fontSize: 13, fontWeight: 700, fontFamily: 'monospace', color: c }}>{v}</span>}
              </div>
            ))}
          </div>

          {/* Progress */}
          <Card style={{ padding: '12px 14px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 7 }}>
              <span style={{ fontSize: 12, fontWeight: 600 }}>Progress</span>
              <span style={{ fontSize: 14, fontWeight: 800, fontFamily: 'monospace', color: C.blue }}>{pct}%</span>
            </div>
            <div style={{ height: 5, background: C.bg, borderRadius: 3, overflow: 'hidden', border: `1px solid ${C.border}` }}>
              <div style={{ height: '100%', width: `${pct}%`, background: C.blue, borderRadius: 3, transition: 'width .5s' }} />
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 5, fontSize: 10, fontFamily: 'monospace', color: C.text3 }}>
              <span>{done.toLocaleString()} processed</span><span>{total.toLocaleString()} total</span>
            </div>
          </Card>

          {/* Current contact */}
          {currentContact && isRunning && (
            <div style={{ background: C.greenBg, border: '1px solid #bbf7d0', borderRadius: 8, padding: '9px 14px', display: 'flex', alignItems: 'center', gap: 10, fontSize: 12 }}>
              <span style={{ width: 7, height: 7, borderRadius: '50%', background: C.green }} />
              <span style={{ fontWeight: 600 }}>{currentContact.name}</span>
              <span style={{ color: C.text2, fontFamily: 'monospace', marginLeft: 'auto' }}>+{currentContact.dialStr}</span>
            </div>
          )}

          {/* Failures */}
          {failLog.length > 0 && (
            <Card>
              <CardSection label={`Failures (${failLog.length})`} />
              <div style={{ overflowX: 'auto', padding: '0 0 4px' }}>
                <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 11 }}>
                  <thead>
                    <tr>{['Name', 'Phone', 'Code', 'Error'].map(h => <th key={h} style={{ padding: '5px 10px', textAlign: 'left', fontSize: 9, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '.5px', color: C.text3, borderBottom: `1px solid ${C.border}` }}>{h}</th>)}</tr>
                  </thead>
                  <tbody>
                    {failLog.slice(-10).map((f, i) => (
                      <tr key={i}>
                        <td style={{ padding: '5px 10px', fontWeight: 500 }}>{f.name}</td>
                        <td style={{ padding: '5px 10px', fontFamily: 'monospace', color: C.text2 }}>{f.phone}</td>
                        <td style={{ padding: '5px 10px' }}><span style={{ background: C.redBg, color: C.red, padding: '1px 5px', borderRadius: 3, fontFamily: 'monospace', fontSize: 10, fontWeight: 700 }}>{f.code}</span></td>
                        <td style={{ padding: '5px 10px', color: C.red, maxWidth: 180, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', fontFamily: 'monospace' }}>{f.error}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </Card>
          )}

          {/* Logs */}
          <Card style={{ overflow: 'hidden', minHeight: 200 }}>
            <CardSection label={`Live Log (${logs.length})`} right={<button onClick={() => setLogs([])} style={{ fontSize: 10, color: C.text3, background: 'none', border: 'none', cursor: 'pointer' }}>Clear</button>} />
            <div style={{ maxHeight: 280, overflowY: 'auto', padding: '2px 0' }}>
              {logs.length === 0 && <div style={{ padding: '16px', textAlign: 'center', color: C.text3, fontSize: 12 }}>No activity yet.</div>}
              {logs.map((e, i) => {
                const lc = { info: C.blue, success: C.green, warn: C.amber, error: C.red }[e.level] || C.text2;
                return (
                  <div key={i} style={{ display: 'flex', gap: 8, padding: '2px 14px', fontFamily: 'monospace', fontSize: 11, lineHeight: 1.8 }}>
                    <span style={{ color: C.text3, flexShrink: 0, width: 58 }}>{e.time}</span>
                    <span style={{ width: 48, flexShrink: 0, fontWeight: 700, fontSize: 10, textTransform: 'uppercase', color: lc }}>{e.level}</span>
                    <span style={{ color: C.text2, wordBreak: 'break-all' }}>{e.msg}</span>
                  </div>
                );
              })}
              <div ref={logEndRef} />
            </div>
          </Card>

        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
